name: Android-app bouwen
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v5
      - id: java
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - id: gradlesetup
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - id: assets
        name: Spel meeleveren (voor als er geen internet is)
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html && cp icon-*.png manifest.webmanifest android/app/src/main/assets/
      - id: build
        name: APK bouwen
        working-directory: android
        run: set -o pipefail; echo "sdk.dir=$ANDROID_HOME" > local.properties; gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - id: rename
        run: cp android/app/build/outputs/apk/release/app-release.apk fuel-run.apk
      - id: release
        name: Publiceren als release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Fuel Run Android-app
          body: |
            Fuel Run voor Android met ingebouwde UDP-luisteraar op poort 6001.
            Download fuel-run.apk op de tablet of telefoon en installeer hem (sta installeren van onbekende bronnen toe).
            Build ${{ github.run_number }} van ${{ github.sha }}.
          files: fuel-run.apk
          make_latest: true
      - name: Bouwlog bewaren (branch ci-logs)
        if: always()
        run: |
          {
            echo "checkout=${{ steps.checkout.outcome }} java=${{ steps.java.outcome }} gradle=${{ steps.gradlesetup.outcome }} assets=${{ steps.assets.outcome }} build=${{ steps.build.outcome }} rename=${{ steps.rename.outcome }} release=${{ steps.release.outcome }}"
            echo "--- java"; java -version 2>&1 || true
            echo "--- gradle"; gradle -v 2>&1 | head -5 || true
            echo "--- ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" 2>&1 | head; ls "$ANDROID_HOME/platforms" 2>&1 | head
            echo "--- build.log"; [ -f build.log ] && tail -c 150000 build.log || echo "(geen)"
          } > /tmp/android-build.log 2>&1
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -q --orphan ci-logs-tmp
          git rm -rfq . || true
          cp /tmp/android-build.log android-build.log
          echo "${{ job.status }} run ${{ github.run_number }} ${{ github.sha }}" > status.txt
          git add android-build.log status.txt
          git commit -qm "Android-bouwlog ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs
